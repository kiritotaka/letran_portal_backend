services:
  - type: web
    name: letran-portal-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
# Analysis is opt-in. After migration 004, set GEMINI_API_KEY,
# GEMINI_MODEL=gemini-3.6-flash and ANALYSIS_WORKER_ENABLED=true in Render Environment.
# The embedded worker runs only while this web service is awake.
